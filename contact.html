<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | My Shop</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-top"><a class="brand" href="./index.html">My Shop</a></div>
  </header>

  <main class="container static-page">
    <section class="static-section-card">
      <h1>Contact</h1>
      <p>Questions about your order or products? Reach out anytime.</p>
      <form class="contact-form">
        <label for="contactName">Name</label>
        <input id="contactName" type="text" placeholder="Your name">
        <label for="contactEmail">Email</label>
        <input id="contactEmail" type="email" placeholder="you@example.com">
        <label for="contactMessage">Message</label>
        <textarea id="contactMessage" rows="4" placeholder="How can we help?"></textarea>
        <button type="button">Send message</button>
      </form>
    </section>
  </main>

  <footer class="site-footer"><div class="container footer-grid"><div><h4>Support</h4><a href="./search.html">Search</a><a href="./privacy.html">Privacy</a><a href="./terms.html">Terms</a></div></div></footer>
</body>
</html>
